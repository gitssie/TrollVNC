[package]
name = "tvnc-wg-onetun"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WireGuard userspace implementation using boringtun and smoltcp for TrollVNC"

[lib]
name = "tvnc_wg_onetun"
crate-type = ["staticlib", "rlib"]

[dependencies]
boringtun = { version = "0.6", default-features = false }
smoltcp = { version = "0.12", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-udp", "socket-tcp", "iface-max-addr-count-8"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
base64 = "0.13"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
opt-level = "z"

[profile.release-with-debug]
inherits = "release"
debug = true

[target.'cfg(target_os = "ios")'.dependencies]
# iOS-specific dependencies if needed