[package]
name = "tvnc-control-http"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bytes = "1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["http2", "stream"] }

[profile.release]
opt-level = "s"
strip = "debuginfo"
